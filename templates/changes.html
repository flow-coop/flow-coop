<flow-version-ready>
  <p class="flow-loading-state" data-version-waiting>Loading changes...</p>
  <template>
    <details class="flow-changes" open>
      <summary>Changes</summary>
      <div class="flow-change-activities">
        <flow-version-activities>
          <template>
            <pos-resource data-version-activity>
              <import-html src="/templates/activity-changes.html">
                <p class="flow-loading-state" data-template-loading>
                  Loading activity...
                </p>
                <template data-error-template>
                  <p class="flow-error-state" role="alert">
                    This activity could not be displayed.
                  </p>
                </template>
              </import-html>
            </pos-resource>
          </template>
          <p class="flow-empty-state" data-empty hidden>
            No provenance was recorded for this version.
          </p>
          <p class="flow-error-state" data-error hidden role="alert">
            Changes could not be displayed.
          </p>
        </flow-version-activities>
      </div>
    </details>
  </template>
  <template data-error-template>
    <p class="flow-error-state" role="alert">
      Changes could not be loaded because the version data is unavailable.
    </p>
  </template>
</flow-version-ready>
