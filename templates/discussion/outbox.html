<flow-collection-pages max-pages="50">
  <template>
    <flow-if-open data-flow-resource>
      <template>
        <import-html src="/templates/discussion/comment.html"></import-html>
      </template>
    </flow-if-open>
  </template>

  <div class="flow-comment-list" data-items></div>
  <p class="flow-empty-state" data-empty hidden>No open comments found.</p>
  <p class="flow-error-state" data-error role="alert">
    Discussion could not be loaded. Try again.
  </p>
  <button class="flow-button flow-button-secondary" data-load-more hidden>
    Load more
  </button>
</flow-collection-pages>
